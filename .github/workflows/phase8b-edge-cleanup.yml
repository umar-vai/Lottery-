name: Phase 8B retired Edge cleanup

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'Phase 8B: execute retired Edge cleanup') ||
      contains(github.event.head_commit.message, 'Phase 8B: retry retired Edge cleanup')
    runs-on: ubuntu-22.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mwtlsnneooxmryondrex
      EDGE_DELETE_CONFIRM: LOOTERA_DELETE_RETIRED_EDGE_STUBS
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require Supabase credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "ERROR: repository secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 86
          fi

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock supabase@2.119.0
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase functions list --help | grep -F -- '--project-ref'
          supabase functions delete --help | grep -F -- '--project-ref'

      - name: Delete retired Lootera Edge stubs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/phase8b-delete-retired-edge-stubs.sh
          ./scripts/phase8b-delete-retired-edge-stubs.sh

      - name: Record result
        if: always()
        shell: bash
        run: |
          {
            echo "## Phase 8B retired Edge cleanup"
            echo
            echo "- Project: `mwtlsnneooxmryondrex`"
            echo "- Retired targets: `phone-bridge`, `bridge-device-admin`, `claim-demo-credit`"
            echo "- Replacement guard: enabled"
            echo "- CLI: pinned `supabase@2.119.0`"
          } >> "$GITHUB_STEP_SUMMARY"
