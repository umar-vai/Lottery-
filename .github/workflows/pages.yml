name: Validate and deploy static site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Phase 0 production smoke gate
        run: node scripts/phase0-smoke.mjs

      - name: Phase 1 security gate
        run: node scripts/phase1-security.mjs

      - name: Phase 2 reliability gate
        run: node scripts/phase2-reliability.mjs

      - name: Phase 3 product gate
        run: node scripts/phase3-product.mjs

      - name: Phase 4 performance and observability gate
        run: node scripts/phase4-performance-observability.mjs

      - name: Phase 5 production readiness gate
        run: node scripts/phase5-production-readiness.mjs

      - name: Phase 6 resilience and disaster recovery gate
        run: node scripts/phase6-resilience.mjs

      - name: Phase 7A production operations gate
        run: node scripts/phase7a-production-ops.mjs

      - name: Phase 7B operations history gate
        run: node scripts/phase7b-ops-history.mjs

      - name: Phase 7C incident alerting gate
        run: node scripts/phase7c-incident-alerting.mjs

      - name: Phase 7D external alert delivery gate
        run: node scripts/phase7d-external-alert-delivery.mjs

      - name: Phase 7E security and DR gate
        run: node scripts/phase7e-security-dr.mjs

      - name: Phase 7F go-live abuse hardening gate
        run: node scripts/phase7f-abuse-hardening.mjs

      - name: Phase 7G load chaos recovery gate
        run: node scripts/phase7g-load-chaos-recovery.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pin to a stable hosted-runner pool so a fresh deployment can be assigned
    # when ubuntu-latest is experiencing queue delays.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
